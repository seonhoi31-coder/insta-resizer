<!DOCTYPE html>
<html>
<head>
    <title>인스타 이미지 크기조절</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background-color: #faf7f2;
            color: #2b2b2b;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .section {
            background-color: #f0ebe1;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .size-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .size-buttons button {
            flex: 1 1 40%;
            padding: 12px;
            background-color: #d8cdb8;
            color: #2b2b2b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .size-buttons button.active {
            background-color: #8a7a5c;
            color: white;
        }
        .size-buttons button:hover { background-color: #c9bda3; }

        #dropZone {
            border: 2px dashed #c9bda3;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #888;
        }
        #dropZone p { margin: 0 0 12px 0; }
        #dropZone .file-label {
            display: inline-block;
            padding: 10px 18px;
            background-color: #8a7a5c;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #dropZone .limit-note { font-size: 12px; margin-top: 10px; color: #999; }

        .results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .result-item {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
        }
        .result-item canvas {
            max-width: 100%;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
        }
        .result-item .info {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
        .result-item .download-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background-color: #8a7a5c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .result-item .download-btn:hover { background-color: #75674d; }

        @media (max-width: 600px) {
            body { padding: 20px 15px; }
            h1 { font-size: 22px; }
            .container { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>인스타 이미지 리사이저</h1>

        <div class="section">
            <div class="size-buttons">
                <button id="btn-feed" data-mode="feed" class="active">피드 게시물</button>
                <button id="btn-story" data-mode="story">스토리</button>
            </div>

            <div id="dropZone" style="margin-top: 15px;">
                <p>사진을 이곳에 끌어다 놓으세요 (최대 5장)</p>
                <label for="imageInput" class="file-label">파일 선택</label>
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <div class="limit-note">한 번에 최대 5장까지 처리할 수 있어요</div>
            </div>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const imageInput = document.getElementById("imageInput");
        const dropZone = document.getElementById("dropZone");
        const resultsDiv = document.getElementById("results");
        const sizeButtons = document.querySelectorAll(".size-buttons button");

        const MAX_FILES = 5;
        let currentMode = "feed";
        let loadedImages = []; // { img, fileName } 목록

        const FEED_WIDTH = 1080;
        const FEED_MIN_HEIGHT = 566;
        const FEED_MAX_HEIGHT = 1350;
        const STORY_WIDTH = 1080;
        const STORY_HEIGHT = 1920;

        sizeButtons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                sizeButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentMode = btn.dataset.mode;
                renderAll();
            });
        });

        function loadImageFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));

            if (files.length === 0) {
                alert("이미지 파일만 업로드할 수 있어요.");
                return;
            }

            if (files.length > MAX_FILES) {
                alert(`한 번에 최대 ${MAX_FILES}장까지만 처리할 수 있어요. 처음 ${MAX_FILES}장만 사용할게요.`);
            }

            const limitedFiles = files.slice(0, MAX_FILES);
            loadedImages = [];
            resultsDiv.innerHTML = "";

            limitedFiles.forEach(function (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        loadedImages.push({ img: img, fileName: file.name });
                        renderAll();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        imageInput.addEventListener("change", function () {
            loadImageFiles(imageInput.files);
        });

        dropZone.addEventListener("dragover", function (e) {
            e.preventDefault();
            dropZone.style.backgroundColor = "#e4dcc9";
            dropZone.style.borderColor = "#8a7a5c";
        });

        dropZone.addEventListener("dragleave", function () {
            dropZone.style.backgroundColor = "";
            dropZone.style.borderColor = "#c9bda3";
        });

        dropZone.addEventListener("drop", function (e) {
            e.preventDefault();
            dropZone.style.backgroundColor = "";
            dropZone.style.borderColor = "#c9bda3";
            loadImageFiles(e.dataTransfer.files);
        });

        function renderAll() {
            resultsDiv.innerHTML = "";

            loadedImages.forEach(function (item, index) {
                const wrapper = document.createElement("div");
                wrapper.className = "result-item";

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                const infoDiv = document.createElement("div");
                infoDiv.className = "info";

                const downloadBtn = document.createElement("button");
                downloadBtn.className = "download-btn";
                downloadBtn.textContent = "다운로드";

                wrapper.appendChild(canvas);
                wrapper.appendChild(infoDiv);
                wrapper.appendChild(downloadBtn);
                resultsDiv.appendChild(wrapper);

                if (currentMode === "story") {
                    drawWithPadding(ctx, canvas, item.img, STORY_WIDTH, STORY_HEIGHT);
                } else {
                    drawFeedImage(ctx, canvas, item.img);
                }

                compressAndShowSize(canvas, infoDiv, downloadBtn, index);
            });
        }

        function drawBlurredBackground(ctx, img, canvasW, canvasH) {
            const coverScale = Math.max(canvasW / img.width, canvasH / img.height) * 1.15;
            const bgWidth = img.width * coverScale;
            const bgHeight = img.height * coverScale;
            const bgX = (canvasW - bgWidth) / 2;
            const bgY = (canvasH - bgHeight) / 2;

            ctx.save();
            ctx.filter = "blur(25px)";
            ctx.drawImage(img, bgX, bgY, bgWidth, bgHeight);
            ctx.restore();
        }

        function drawFeedImage(ctx, canvas, img) {
            const naturalHeight = (img.height / img.width) * FEED_WIDTH;

            if (naturalHeight >= FEED_MIN_HEIGHT && naturalHeight <= FEED_MAX_HEIGHT) {
                canvas.width = FEED_WIDTH;
                canvas.height = Math.round(naturalHeight);
                ctx.drawImage(img, 0, 0, FEED_WIDTH, canvas.height);

            } else if (naturalHeight < FEED_MIN_HEIGHT) {
                canvas.width = FEED_WIDTH;
                canvas.height = FEED_MIN_HEIGHT;

                drawBlurredBackground(ctx, img, canvas.width, canvas.height);

                const offsetY = (FEED_MIN_HEIGHT - naturalHeight) / 2;
                ctx.drawImage(img, 0, offsetY, FEED_WIDTH, naturalHeight);

            } else {
                const scale = FEED_MAX_HEIGHT / img.height;
                const drawWidth = img.width * scale;

                canvas.width = FEED_WIDTH;
                canvas.height = FEED_MAX_HEIGHT;

                drawBlurredBackground(ctx, img, canvas.width, canvas.height);

                const offsetX = (FEED_WIDTH - drawWidth) / 2;
                ctx.drawImage(img, offsetX, 0, drawWidth, FEED_MAX_HEIGHT);
            }
        }

        function drawWithPadding(ctx, canvas, img, targetW, targetH) {
            canvas.width = targetW;
            canvas.height = targetH;

            drawBlurredBackground(ctx, img, targetW, targetH);

            const scale = Math.min(targetW / img.width, targetH / img.height);
            const drawWidth = img.width * scale;
            const drawHeight = img.height * scale;
            const offsetX = (targetW - drawWidth) / 2;
            const offsetY = (targetH - drawHeight) / 2;

            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        }

        function compressAndShowSize(canvas, infoDiv, downloadBtn, index, targetSizeKB = 2000) {
            let quality = 0.92;

            function tryCompress() {
                canvas.toBlob(function (blob) {
                    const sizeKB = blob.size / 1024;

                    if (sizeKB > targetSizeKB && quality > 0.3) {
                        quality -= 0.08;
                        tryCompress();
                    } else {
                        infoDiv.textContent =
                            `${canvas.width}×${canvas.height}px · 약 ${Math.round(sizeKB)}KB (화질 ${Math.round(quality * 100)}%)`;
                        downloadBtn.onclick = function () {
                            const link = document.createElement("a");
                            link.download = `instagram-resized-${index + 1}.jpg`;
                            link.href = URL.createObjectURL(blob);
                            link.click();
                        };
                    }
                }, "image/jpeg", quality);
            }

            tryCompress();
        }
    </script>
</body>
</html>
